<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spend Pi Map</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f5f5f5}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 2px 10px #ccc;max-width:400px;margin:auto}
button{background:#673ab7;color:white;padding:12px 25px;border:none;border-radius:8px;font-size:16px;margin-top:15px}
h1{color:#673ab7}
</style>
</head>
<body>
<div class="card">
<h1>Spend Pi Map</h1>
<p>Find shops wey dey collect Pi near you!</p>
<p id="status">Loading Pi SDK...</p>
<button onclick="login()">Login with Pi</button>
<button onclick="pay()">Test Payment 0.01 Pi</button>
</div>
<script>
const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:false});

function login(){
 Pi.authenticate(['username'], function(auth){
   document.getElementById('status').innerText = "Welcome " + auth.user.username;
 }).catch(e=>{alert("Login error");});
}

function pay(){
 Pi.createPayment({
   amount:0.01,
   memo:"Test Spend Pi Map",
   metadata:{type:"test"}
 },{
   onReadyForServerApproval: function(paymentId){ console.log(paymentId); },
   onReadyForServerCompletion: function(paymentId, txid){ alert("Payment done!"); },
   onCancel: function(){ alert("Cancelled"); },
   onError: function(e){ alert("Error"); }
 });
}
document.getElementById('status').innerText = "Pi SDK Ready - Click Login";
</script>
</body>
</html>
